# NOTE: the production service (aamnhs-attendance) and its Postgres/Key Value
# store were provisioned directly in the AAMNHS Portal workspace. Applying this
# blueprint to that same workspace would try to create duplicate resources with
# the same names. Use it for a fresh workspace, or delete it if the live
# resources are the source of truth.
services:
  - type: web
    name: aamnhs-attendance
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: mnhs-attendance/Dockerfile
    dockerContext: mnhs-attendance
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: "AAMNHS Attendance"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # Set in the Render dashboard (do not commit a real key to git).
      - key: APP_KEY
        sync: false
      - key: APP_URL
        value: https://aamnhs-attendance.onrender.com
      - key: APP_LOCALE
        value: en
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
      # Render routes traffic to the port named by PORT.
      - key: PORT
        value: "8080"
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: aamnhs-db
          property: host
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        fromDatabase:
          name: aamnhs-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: aamnhs-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: aamnhs-db
          property: password
      - key: DB_SSLMODE
        value: prefer
      - key: SESSION_DRIVER
        value: redis
      - key: SESSION_ENCRYPT
        value: "true"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: redis
      - key: QUEUE_CONNECTION
        value: redis
      - key: REDIS_CLIENT
        value: phpredis
      - key: REDIS_HOST
        fromService:
          type: redis
          name: aamnhs-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: aamnhs-redis
          property: port
      # Render Key Value internal connections are not TLS; the external
      # connection string is. The app talks to it over the private network.
      - key: REDIS_TLS
        value: "false"
      # Set REDIS_TLS to "true" only if the service is switched to the
      # external rediss:// URL instead of the internal host/port above.
      - key: FILESYSTEM_DISK
        value: supabase
      - key: SUPABASE_STORAGE_KEY
        sync: false
      - key: SUPABASE_STORAGE_SECRET
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: aamnhs-files
      - key: SUPABASE_STORAGE_URL
        sync: false
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: "AAMNHS Attendance"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://aamnhs-attendance.onrender.com/auth/google/callback
      - key: GOOGLE_API_KEY
        sync: false
      - key: QUEUE_WORKER_SECRET
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: AI_MAX_TOKENS
        value: "1024"
      - key: AI_TIMEOUT_SECONDS
        value: "60"

  - type: redis
    name: aamnhs-redis
    plan: free
    region: singapore
    ipAllowList: []

databases:
  - name: aamnhs-db
    databaseName: aamnhs_attendance
    user: aamnhs_user
    plan: free
    region: singapore
