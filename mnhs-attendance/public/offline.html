<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Offline — AAMNHS Attendance</title>
        <style>
            :root {
                color-scheme: light;
            }

            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                background: linear-gradient(160deg, #0b1f3a, #12325c);
                font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
                color: #e2e8f0;
                padding: 24px;
            }

            .card {
                max-width: 420px;
                width: 100%;
                background: rgba(255, 255, 255, 0.06);
                border: 1px solid rgba(255, 255, 255, 0.12);
                border-radius: 18px;
                padding: 32px 28px;
                text-align: center;
                backdrop-filter: blur(8px);
            }

            h1 {
                font-size: 20px;
                margin: 0 0 10px;
            }

            p {
                font-size: 14px;
                line-height: 1.6;
                color: #cbd5e1;
                margin: 0 0 20px;
            }

            .badge {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                padding: 6px 14px;
                border-radius: 999px;
                background: rgba(251, 191, 36, 0.15);
                color: #fbbf24;
                font-size: 12px;
                font-weight: 700;
                letter-spacing: 0.04em;
                text-transform: uppercase;
                margin-bottom: 18px;
            }

            button {
                appearance: none;
                border: 0;
                border-radius: 10px;
                background: #f8fafc;
                color: #0b1f3a;
                font-weight: 700;
                font-size: 14px;
                padding: 12px 22px;
                cursor: pointer;
            }

            button:active {
                transform: scale(0.98);
            }

            .hint {
                margin-top: 18px;
                font-size: 12px;
                color: #94a3b8;
            }
        </style>
    </head>
    <body>
        <main class="card">
            <div class="badge">Offline</div>
            <h1>You are not connected</h1>
            <p>
                Scans you take at the gate are saved on this device and will be sent to the
                server automatically once the internet connection returns.
            </p>
            <button type="button" onclick="window.location.reload()">Try again</button>
            <p class="hint">AAMNHS Attendance Management System</p>
        </main>
    </body>
</html>
