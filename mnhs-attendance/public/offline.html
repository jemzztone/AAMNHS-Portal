<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#0b1f3a" />
        <title>Offline — AAMNHS Attendance</title>
        <style>
            :root {
                color-scheme: light;
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                background: linear-gradient(160deg, #0b1f3a, #12325c);
                font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
                color: #e2e8f0;
                padding: 20px;
            }

            .card {
                max-width: 620px;
                width: 100%;
                background: rgba(255, 255, 255, 0.06);
                border: 1px solid rgba(255, 255, 255, 0.12);
                border-radius: 18px;
                padding: 28px 24px;
                backdrop-filter: blur(8px);
            }

            .top {
                display: flex;
                align-items: flex-start;
                justify-content: space-between;
                gap: 16px;
            }

            h1 {
                font-size: 21px;
                margin: 0 0 8px;
            }

            p {
                font-size: 14px;
                line-height: 1.6;
                color: #cbd5e1;
                margin: 0;
            }

            .badge {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                padding: 6px 12px;
                border-radius: 999px;
                background: rgba(251, 191, 36, 0.15);
                color: #fbbf24;
                font-size: 11px;
                font-weight: 700;
                letter-spacing: 0.04em;
                text-transform: uppercase;
                white-space: nowrap;
            }

            .badge.online {
                background: rgba(16, 185, 129, 0.15);
                color: #34d399;
            }

            .count {
                margin-top: 18px;
                font-size: 15px;
                font-weight: 700;
                color: #f8fafc;
            }

            .hint {
                margin-top: 4px;
                font-size: 12px;
                color: #94a3b8;
            }

            .queue {
                margin-top: 14px;
                display: grid;
                gap: 10px;
            }

            .scan {
                display: grid;
                grid-template-columns: 1fr auto;
                gap: 10px;
                align-items: center;
                background: rgba(15, 23, 42, 0.45);
                border: 1px solid rgba(148, 163, 184, 0.22);
                border-radius: 12px;
                padding: 12px 14px;
            }

            .scan-main {
                min-width: 0;
            }

            .scan-ref {
                font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                font-size: 13px;
                font-weight: 700;
                color: #f8fafc;
                overflow-wrap: anywhere;
            }

            .scan-meta {
                margin-top: 3px;
                font-size: 11px;
                color: #94a3b8;
            }

            .empty {
                margin-top: 14px;
                border: 1px dashed rgba(148, 163, 184, 0.4);
                border-radius: 12px;
                padding: 18px;
                text-align: center;
                font-size: 13px;
                color: #cbd5e1;
            }

            .remove {
                appearance: none;
                border: 1px solid rgba(248, 113, 113, 0.4);
                background: rgba(248, 113, 113, 0.12);
                color: #fca5a5;
                font-weight: 700;
                font-size: 11px;
                border-radius: 8px;
                padding: 7px 10px;
                cursor: pointer;
            }

            .actions {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                margin-top: 20px;
            }

            button.primary,
            a.primary {
                appearance: none;
                border: 0;
                border-radius: 10px;
                background: #f8fafc;
                color: #0b1f3a;
                font-weight: 700;
                font-size: 14px;
                padding: 11px 18px;
                cursor: pointer;
                text-decoration: none;
                text-align: center;
            }

            button.secondary,
            a.secondary {
                appearance: none;
                border: 1px solid rgba(226, 232, 240, 0.3);
                border-radius: 10px;
                background: transparent;
                color: #e2e8f0;
                font-weight: 700;
                font-size: 14px;
                padding: 10px 18px;
                cursor: pointer;
                text-decoration: none;
                text-align: center;
            }

            button:disabled {
                opacity: 0.5;
                cursor: default;
            }

            .footer {
                margin-top: 20px;
                font-size: 11px;
                color: #94a3b8;
                text-align: center;
            }
        </style>
    </head>
    <body>
        <main class="card">
            <div class="top">
                <div>
                    <h1>Offline scan monitor</h1>
                    <p>
                        You are offline, but scans taken at the gate are still saved on
                        this device.
                    </p>
                </div>
                <span class="badge" id="connection">Offline</span>
            </div>

            <p class="count" id="count">Loading saved scans…</p>
            <p class="hint">These will upload automatically when the connection returns.</p>

            <div class="queue" id="queue"></div>

            <div class="actions">
                <button type="button" class="primary" id="refresh">Refresh list</button>
                <a class="secondary" href="/guard/scan">Open scanner</a>
            </div>

            <p class="footer">AAMNHS Attendance Management System</p>
        </main>

        <script>
            const DB_NAME = 'aamnhs-offline';
            const DB_VERSION = 1;
            const STORE = 'scan-queue';

            const countEl = document.getElementById('count');
            const queueEl = document.getElementById('queue');
            const connectionEl = document.getElementById('connection');
            const refreshButton = document.getElementById('refresh');

            function formatTime(value) {
                if (!value) return '—';
                const date = new Date(value);
                if (Number.isNaN(date.getTime())) return String(value);

                return date.toLocaleString('en-PH', {
                    timeZone: 'Asia/Manila',
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit',
                    hour12: true,
                });
            }

            function openDatabase() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(DB_NAME, DB_VERSION);

                    request.onupgradeneeded = () => {
                        const db = request.result;
                        if (!db.objectStoreNames.contains(STORE)) {
                            const store = db.createObjectStore(STORE, {
                                keyPath: 'client_id',
                            });
                            store.createIndex('queued_at', 'queued_at');
                        }
                    };

                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            }

            function getScans() {
                return openDatabase().then(
                    (db) =>
                        new Promise((resolve, reject) => {
                            const transaction = db.transaction(STORE, 'readonly');
                            const request = transaction.objectStore(STORE).getAll();

                            request.onsuccess = () => resolve(request.result || []);
                            request.onerror = () => reject(request.error);
                            transaction.oncomplete = () => db.close();
                        }),
                );
            }

            function removeScan(clientId) {
                return openDatabase().then(
                    (db) =>
                        new Promise((resolve, reject) => {
                            const transaction = db.transaction(STORE, 'readwrite');
                            transaction.objectStore(STORE).delete(clientId);
                            transaction.oncomplete = () => {
                                db.close();
                                resolve();
                            };
                            transaction.onerror = () => {
                                db.close();
                                reject(transaction.error);
                            };
                        }),
                );
            }

            function makeScanRow(scan) {
                const row = document.createElement('article');
                row.className = 'scan';

                const main = document.createElement('div');
                main.className = 'scan-main';

                const ref = document.createElement('div');
                ref.className = 'scan-ref';
                ref.textContent = scan.lrn
                    ? 'LRN ' + scan.lrn
                    : 'QR ' + String(scan.qr_token || '').slice(0, 12) + '…';

                const meta = document.createElement('div');
                meta.className = 'scan-meta';
                meta.textContent =
                    'Mode ' +
                    String(scan.mode || 'auto').replace('_', ' ') +
                    ' · Queued ' +
                    formatTime(scan.queued_at) +
                    ' · Scanned ' +
                    formatTime(scan.scanned_at);

                main.append(ref, meta);

                const remove = document.createElement('button');
                remove.type = 'button';
                remove.className = 'remove';
                remove.textContent = 'Remove';
                remove.addEventListener('click', async () => {
                    if (!window.confirm('Remove this queued scan? It will never be recorded.')) {
                        return;
                    }

                    remove.disabled = true;
                    try {
                        await removeScan(scan.client_id);
                        await render();
                    } catch {
                        remove.disabled = false;
                        window.alert('Could not remove this scan. Please try again.');
                    }
                });

                row.append(main, remove);

                return row;
            }

            async function render() {
                refreshButton.disabled = true;

                try {
                    const scans = await getScans();
                    scans.sort((a, b) => new Date(a.queued_at) - new Date(b.queued_at));

                    countEl.textContent =
                        scans.length + ' scan' + (scans.length === 1 ? '' : 's') + ' saved on this device';
                    queueEl.replaceChildren();

                    if (scans.length === 0) {
                        const empty = document.createElement('div');
                        empty.className = 'empty';
                        empty.textContent = 'No pending scans. Everything recorded here has been uploaded.';
                        queueEl.append(empty);
                    } else {
                        scans.forEach((scan) => queueEl.append(makeScanRow(scan)));
                    }
                } catch {
                    countEl.textContent = 'Saved scans could not be read';
                    queueEl.replaceChildren();
                } finally {
                    refreshButton.disabled = false;
                }
            }

            function updateConnection() {
                const online = navigator.onLine;
                connectionEl.textContent = online ? 'Online' : 'Offline';
                connectionEl.classList.toggle('online', online);
            }

            refreshButton.addEventListener('click', render);
            window.addEventListener('online', updateConnection);
            window.addEventListener('offline', updateConnection);

            updateConnection();
            render();
        </script>
    </body>
</html>
