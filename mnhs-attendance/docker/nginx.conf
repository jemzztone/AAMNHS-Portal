server {
    listen 8080;
    server_name _;
    root /var/www/html/public;

    index index.php;

    # Student photos and CSV/XLSX imports (PHP limits are 10M/12M).
    client_max_body_size 12m;

    # Alpine's mime.types has no .webmanifest mapping, so it would be served as
    # application/octet-stream and browsers would ignore the PWA manifest.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Always revalidate the service worker so a new deploy can take over.
    location = /sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # php-fpm in the official image listens on 127.0.0.1:9000.
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 120s;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
